name: Catalog validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate records and generated views
        run: python scripts/build_catalog.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run example tests
        run: python -m unittest discover -s examples -p 'test_*.py' -v
      - name: Check whitespace errors
        run: git diff --check
