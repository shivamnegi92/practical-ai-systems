name: Catalog validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate records and generated views
        run: python scripts/build_catalog.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run decision path tests
        run: python -m unittest discover -s tests -p 'test_paths.py' -v
      - name: Run shared and system tests
        run: python -m unittest discover -s common -t . -v && python -m unittest discover -s systems -p 'test_*.py' -v
      - name: Verify reproducible system reports
        run: python scripts/evaluate_systems.py --check && python scripts/evaluate_systems.py --write && git diff --exit-code -- systems/*/eval/results.json
      - name: Validate system README index
        run: python scripts/render_systems.py
      - name: Run example tests
        run: python -m unittest discover -s examples -p 'test_*.py' -v
      - name: Check whitespace errors
        run: git diff --check
