<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Practical AI Systems: a visual map of 30 runnable projects</title>
  <desc id="desc">An illustrated project dashboard shows a document question answering flow, a three-level learning path, and an evaluation scorecard. This is an illustration, not a screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101a35"/>
      <stop offset="1" stop-color="#243f69"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#63e2c1"/>
      <stop offset="1" stop-color="#8cb7ff"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#071023" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <circle cx="1100" cy="-10" r="190" fill="#72e0c0" opacity=".08"/>
  <circle cx="20" cy="430" r="210" fill="#9ebcff" opacity=".07"/>

  <text x="58" y="70" fill="#91f0d4" font-family="system-ui,sans-serif" font-size="15" font-weight="750" letter-spacing="3">A HANDS-ON FIELD GUIDE</text>
  <text x="56" y="133" fill="#ffffff" font-family="system-ui,sans-serif" font-size="46" font-weight="800">Build the system.</text>
  <text x="56" y="188" fill="#ffffff" font-family="system-ui,sans-serif" font-size="46" font-weight="800">Measure where it breaks.</text>
  <text x="59" y="229" fill="#cad8ef" font-family="system-ui,sans-serif" font-size="18">30 offline-first AI projects · runnable code · tests · honest limits</text>

  <rect x="58" y="267" width="204" height="48" rx="24" fill="url(#accent)"/>
  <text x="84" y="297" fill="#10243c" font-family="system-ui,sans-serif" font-size="15" font-weight="800">START WITH DOC Q&amp;A</text>
  <text x="59" y="354" fill="#9eb4d1" font-family="system-ui,sans-serif" font-size="14">Illustrated overview · not a product screenshot</text>

  <g filter="url(#shadow)">
    <rect x="692" y="49" width="453" height="337" rx="20" fill="#f7f9fd"/>
    <rect x="692" y="49" width="453" height="43" rx="20" fill="#e9eef7"/>
    <path d="M692 72q0-23 20-23h413q20 0 20 23v20H692z" fill="#e9eef7"/>
    <circle cx="719" cy="70" r="5" fill="#ee7b7b"/>
    <circle cx="737" cy="70" r="5" fill="#eebc69"/>
    <circle cx="755" cy="70" r="5" fill="#55bb91"/>
    <rect x="715" y="110" width="126" height="250" rx="12" fill="#edf2fa"/>
    <text x="731" y="138" fill="#455875" font-family="system-ui,sans-serif" font-size="12" font-weight="700">LEARNING PATH</text>
    <rect x="730" y="154" width="95" height="42" rx="9" fill="#d8f6ec"/>
    <circle cx="747" cy="175" r="10" fill="#17866d"/>
    <text x="744" y="179" fill="#ffffff" font-family="system-ui,sans-serif" font-size="10" font-weight="700">1</text>
    <text x="765" y="179" fill="#1e624f" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Beginner</text>
    <path d="M747 196v17" stroke="#85bbaa" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="730" y="213" width="95" height="42" rx="9" fill="#e2ebff"/>
    <circle cx="747" cy="234" r="10" fill="#4e73c7"/>
    <text x="744" y="238" fill="#ffffff" font-family="system-ui,sans-serif" font-size="10" font-weight="700">2</text>
    <text x="765" y="238" fill="#344f8b" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Intermediate</text>
    <path d="M747 255v17" stroke="#a5b8e1" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="730" y="272" width="95" height="42" rx="9" fill="#f0e7fb"/>
    <circle cx="747" cy="293" r="10" fill="#8a5db8"/>
    <text x="744" y="297" fill="#ffffff" font-family="system-ui,sans-serif" font-size="10" font-weight="700">3</text>
    <text x="765" y="297" fill="#654183" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Advanced</text>

    <text x="865" y="126" fill="#31425e" font-family="system-ui,sans-serif" font-size="14" font-weight="800">DOCUMENT Q&amp;A</text>
    <text x="865" y="149" fill="#73829a" font-family="system-ui,sans-serif" font-size="11">Question → evidence → answer or abstain</text>
    <rect x="865" y="164" width="254" height="54" rx="10" fill="#eaf0fa"/>
    <text x="880" y="187" fill="#40536e" font-family="system-ui,sans-serif" font-size="11" font-weight="650">How much does Pro cost?</text>
    <text x="880" y="205" fill="#7b8aa1" font-family="system-ui,sans-serif" font-size="10">Try a question with no source evidence, too.</text>
    <rect x="865" y="231" width="254" height="72" rx="10" fill="#dff6ed"/>
    <text x="880" y="254" fill="#1a654f" font-family="system-ui,sans-serif" font-size="11" font-weight="750">ANSWER · $8 per user / month</text>
    <text x="880" y="275" fill="#387b67" font-family="system-ui,sans-serif" font-size="10">Citation: billing.md, paragraph 1</text>
    <text x="880" y="291" fill="#387b67" font-family="system-ui,sans-serif" font-size="10">Evidence is visible; unsupported asks abstain.</text>

    <rect x="865" y="316" width="254" height="44" rx="10" fill="#293e61"/>
    <text x="880" y="335" fill="#cde0ff" font-family="system-ui,sans-serif" font-size="9" font-weight="700" letter-spacing="1">EVALUATION · SYNTHETIC FIXTURE</text>
    <rect x="880" y="344" width="115" height="5" rx="3" fill="#50688d"/>
    <rect x="880" y="344" width="91" height="5" rx="3" fill="#63e2c1"/>
    <text x="1007" y="351" fill="#ffffff" font-family="system-ui,sans-serif" font-size="10" font-weight="700">22 cases</text>
  </g>
</svg>
