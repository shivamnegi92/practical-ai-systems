<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Approval-gated tool workflow</title>
  <desc id="desc">A tool request is checked against an allow-list and pauses for human approval before a refund.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a2b"/><stop offset="1" stop-color="#18544b"/></linearGradient></defs>
  <rect width="720" height="360" rx="24" fill="url(#bg)"/>
  <text x="36" y="52" fill="#9ce6ce" font-family="system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="2">AGENTS / BOUND THE ACTION</text>
  <rect x="36" y="132" width="150" height="100" rx="16" fill="#fff" opacity=".96"/>
  <text x="65" y="174" fill="#173c36" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Request</text><text x="55" y="199" fill="#4a746b" font-family="system-ui,sans-serif" font-size="13">issue refund</text>
  <path d="M186 182h53m0 0-11-10m11 10-11 10" stroke="#9ce6ce" stroke-width="4" fill="none"/>
  <rect x="253" y="132" width="175" height="100" rx="16" fill="#d9f6eb"/>
  <text x="282" y="174" fill="#15563f" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Allow-list</text><text x="277" y="199" fill="#39765f" font-family="system-ui,sans-serif" font-size="13">known tool + schema</text>
  <path d="M428 182h53m0 0-11-10m11 10-11 10" stroke="#9ce6ce" stroke-width="4" fill="none"/>
  <rect x="495" y="112" width="189" height="140" rx="16" fill="#ffe8bc"/>
  <text x="519" y="156" fill="#624211" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Human approval</text><text x="519" y="184" fill="#785922" font-family="system-ui,sans-serif" font-size="13">pause before side effect</text>
  <rect x="519" y="202" width="137" height="30" rx="8" fill="#fff"/><text x="538" y="222" fill="#624211" font-family="system-ui,sans-serif" font-size="12" font-weight="700">APPROVE / DENY</text>
  <text x="36" y="296" fill="#d0eee4" font-family="system-ui,sans-serif" font-size="14">Deterministic policy baseline · no model planner · three synthetic policy cases</text>
</svg>
